
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Website statis yang dikelola menggunakan n8n ChatOps.">
  <meta name="theme-color" content="#0f172a">

  <title>Website Baru</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    main {
      width: 100%;
      max-width: 720px;
      padding: 48px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
    }

    p {
      color: #cbd5e1;
      line-height: 1.8;
    }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 9px 16px;
      color: #86efac;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 999px;
      font-size: 0.9rem;
    }

    footer {
      margin-top: 36px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>Website Berhasil Dibuat!</h1>

    <p>
      Selamat datang di website baru kamu.
      Website ini menggunakan GitHub Pages dan
      dikelola melalui n8n Telegram ChatOps.
    </p>

    <span class="status">● Website siap digunakan</span>

    <footer>
      Powered by GitHub Pages &amp; n8n ChatOps
    </footer>
  </main>
</body>
</html>
